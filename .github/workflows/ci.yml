name: SouthAPI SDK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Locate independent package
        shell: bash
        run: |
          if [ -f south-api-sdk/composer.json ]; then
            echo "SDK_DIRECTORY=south-api-sdk" >> "$GITHUB_ENV"
          else
            echo "SDK_DIRECTORY=." >> "$GITHUB_ENV"
          fi
      - run: composer install --no-interaction --prefer-dist
        working-directory: ${{ env.SDK_DIRECTORY }}
      - run: composer check
        working-directory: ${{ env.SDK_DIRECTORY }}
      - run: composer audit
        working-directory: ${{ env.SDK_DIRECTORY }}
      - run: composer release
        working-directory: ${{ env.SDK_DIRECTORY }}
      - run: composer consumer
        working-directory: ${{ env.SDK_DIRECTORY }}
